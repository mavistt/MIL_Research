model:
  name: clam_sb
  input_dim: 1024
  model_size: small
  gated: true
  k_sample: 8
  n_classes: 2
  subtyping: false
  bag_weight: 0.7
  dropout: 0.25
training:
  batch_size: 1
  wsi_shuffle: true
  patch_shuffle: false
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: adam
  betas: [0.9, 0.999]
  early_stopping: false
  early_stopping_patience: 10
  selection_metric: val_auroc
  num_workers: 0
  device: auto
reproducibility:
  split_seed: 1234
  training_seed: 0
evaluation:
  threshold: 0.5
