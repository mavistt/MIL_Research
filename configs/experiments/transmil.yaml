model:
  name: transmil
  input_dim: 1024
  n_classes: 2
training:
  batch_size: 1
  epochs: 200
  learning_rate: 0.0002
  weight_decay: 0.00001
  betas: [0.9, 0.999]
  optimizer: lookahead_radam
  lookahead_alpha: 0.5
  lookahead_k: 6
  data_shuffle: false
  fp16: false
  gradient_accumulation_steps: 1
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_min_epoch: 1
  selection_metric: val_auroc
  num_workers: 0
  device: auto
reproducibility:
  split_seed: 1234
  training_seed: 0
evaluation:
  threshold: 0.5
